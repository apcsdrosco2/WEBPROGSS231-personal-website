<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Style Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        
        .image-card {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .image-card:hover {
            transform: scale(1.05);
        }
        
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .caption {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            display: none;
        }
        
        .image-card:hover .caption {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Replace "img/example.jpg" with the path to your image -->
        <div class="image-card">
            <img src="img/example1.jpg" alt="Post 1">
            <div class="caption">Caption for Post 1</div>
        </div>

        <div class="image-card">
            <img src="img/example2.jpg" alt="Post 2">
            <div class="caption">Caption for Post 2</div>
        </div>

        <div class="image-card">
            <img src="img/example3.jpg" alt="Post 3">
            <div class="caption">Caption for Post 3</div>
        </div>

        <div class="image-card">
            <img src="img/example4.jpg" alt="Post 4">
            <div class="caption">Caption for Post 4</div>
        </div>

        <!-- Add more images as needed -->
    </div>
</body>
</html>
