<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Style Single Image Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .viewer {
            position: relative;
            width: 600px;
            height: 600px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .viewer img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        .button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .viewer:hover .button {
            opacity: 1;
        }

        .button.prev {
            left: 10px;
        }

        .button.next {
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="viewer">
        <button class="button prev" onclick="prevImage()">Previous</button>
        <img id="image" src="img/example1.jpg" alt="Post">
        <button class="button next" onclick="nextImage()">Next</button>
    </div>

    <script>
        const images = [
            "img/example1.jpg",
            "img/example2.jpg",
            "img/example3.jpg",
            "img/example4.jpg"
        ];

        let currentIndex = 0;

        function showImage(index) {
            const imgElement = document.getElementById('image');
            imgElement.src = images[index];
        }

        function prevImage() {
            currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
            showImage(currentIndex);
        }

        function nextImage() {
            currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
            showImage(currentIndex);
        }
    </script>
</body>
</html>
